<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Especificaciones OT — Colombia OT 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./maestra.css">
  <link rel="stylesheet" href="./navbar-footer.css">
  <link rel="stylesheet" href="./oot-complementario.css">
  <link rel="stylesheet" href="./especificaciones.css">
</head>
<body>
  <div id="oot-navbar-placeholder"></div>

  <div class="page-banner">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb" style="background:transparent;padding:0;margin-bottom:12px;">
          <li class="breadcrumb-item"><a href="./index.html" style="color:rgba(255,255,255,0.75);">Inicio</a></li>
          <li class="breadcrumb-item active" style="color:#fff;" aria-current="page">Especificaciones OT</li>
        </ol>
      </nav>
      <div>
        <span class="banner-tag"><i class="fas fa-layer-group"></i> LADM-COL-POT</span>
        <span class="banner-tag amber"><i class="fas fa-download"></i> Descargas</span>
      </div>
      <h1><i class="fas fa-layer-group mr-2"></i>Especificaciones OT — LADM-COL-POT</h1>
      <p>Documentaci&oacute;n t&eacute;cnica, modelos de dominio y normatividad del est&aacute;ndar LADM-COL-POT para el ordenamiento territorial.</p>
    </div>
    <i class="fas fa-layer-group page-banner-deco"></i>
  </div>

  <main class="container mt-4 mb-5">
    <!-- Filtros por categoría -->
    <div class="mb-4">
      <span class="font-weight-bold small text-uppercase text-muted mr-2 filtros-label">Filtrar por:</span>
      <span class="filtros-scroll">
        <button class="btn btn-outline-secondary btn-sm filtro-btn active" data-cat="">Todos</button>
        <button class="btn btn-outline-secondary btn-sm filtro-btn" data-cat="Guía técnica">Guías técnicas</button>
        <button class="btn btn-outline-secondary btn-sm filtro-btn" data-cat="Especificación técnica">Especificaciones</button>
        <button class="btn btn-outline-secondary btn-sm filtro-btn" data-cat="Normatividad">Normatividad</button>
        <button class="btn btn-outline-secondary btn-sm filtro-btn" data-cat="Datos técnicos">Datos técnicos</button>
      </span>
    </div>

    <!-- Estado carga -->
    <div id="estado-carga" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Cargando archivos...</p>
    </div>

    <!-- Grid de archivos -->
    <div id="grid-archivos" class="row" style="display:none"></div>
  </main>

  <div id="oot-footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./config.js"></script>
  <script src="./oot.js"></script>
  <script src="./js/especificaciones.js"></script>
