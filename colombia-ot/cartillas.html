<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartillas, Guías y Manuales — Colombia OT 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../maestra.css">
  <link rel="stylesheet" href="../navbar-footer.css?v=ott-live-footer-20260721">
  <link rel="stylesheet" href="../oot-complementario.css">
  <link rel="stylesheet" href="css/inline-extracted.css">
    <link rel="stylesheet" href="../mobile-warning.css">
  <script defer src="../mobile-warning.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css">
  <link rel="stylesheet" href="../css/shared-auth-modal.css?v=auth-modal-20260721">
  <script defer src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth__es.js"></script>
  <script defer src="../js/shared-auth-modal.js?v=close-button-fix-20260722"></script>
  <script defer src="../js/shared-auth.js"></script>
</head>
<body>
  <div id="oot-navbar-placeholder"></div>

  <div class="page-banner">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../index.html">Inicio</a></li>
          <li class="breadcrumb-item active" id="bc-nombre"></li>
        </ol>
      </nav>
      <h1 id="banner-titulo"></h1>
      <p id="banner-desc"></p>
    </div>
  </div>

  <main class="container mt-4 mb-5">
    <!-- Filtros -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row">
          <div class="col-md-3 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Año</label>
            <select id="filtro-annio" class="form-control form-control-sm">
              <option value="">Todos los años</option>
            </select>
          </div>
          <div class="col-md-3 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Dimensión</label>
            <select id="filtro-dimension" class="form-control form-control-sm">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="col-md-3 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Componente</label>
            <select id="filtro-componente" class="form-control form-control-sm">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-md-3 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Buscar</label>
            <div class="input-group input-group-sm">
              <input type="text" id="input-busqueda" class="form-control" placeholder="Título, tema...">
              <div class="input-group-append">
                <button class="btn btn-primary" id="btn-buscar">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado carga -->
    <div id="estado-carga" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Consultando recursos...</p>
    </div>

    <!-- Resultados -->
    <div id="contenedor-recursos"></div>

    <!-- Paginación -->
    <div id="paginacion" class="d-flex justify-content-between align-items-center mt-3">
      <small class="text-muted" id="info-pagina"></small>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary" id="btn-anterior">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button class="btn btn-outline-secondary" id="btn-siguiente">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </main>

  <div id="oot-footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../oot.js"></script>
  <script src="js/cartillas.js"></script>
</body>
</html>
