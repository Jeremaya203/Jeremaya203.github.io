<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de POTs — Colombia OT 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../maestra.css">
  <link rel="stylesheet" href="../navbar-footer.css">
  <link rel="stylesheet" href="../oot-complementario.css">
</head>
<body>
  <div id="oot-navbar-placeholder"></div>

  <div class="page-banner">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../index.html">Inicio</a></li>
          <li class="breadcrumb-item active">Buscador de POTs</li>
        </ol>
      </nav>
      <h1><i class="fas fa-search-location mr-2"></i>Buscador de POTs</h1>
      <p>Consulta los Planes de Ordenamiento Territorial de todos los municipios de Colombia.</p>
    </div>
  </div>

  <main class="container mt-4 mb-5">
    <!-- Filtros -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row">
          <div class="col-md-3 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Departamento</label>
            <select id="filtro-depto" class="form-control form-control-sm">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-md-3 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Municipio</label>
            <select id="filtro-municipio" class="form-control form-control-sm">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-md-2 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Año</label>
            <select id="filtro-annio" class="form-control form-control-sm">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-md-4 mb-2">
            <label class="font-weight-bold small text-uppercase text-muted">Buscar</label>
            <div class="input-group input-group-sm">
              <input type="text" id="input-busqueda" class="form-control" placeholder="Municipio, departamento...">
              <div class="input-group-append">
                <button class="btn btn-primary" id="btn-buscar">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado carga -->
    <div id="estado-carga" class="text-center py-5" style="display:none">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Consultando POTs...</p>
    </div>

    <!-- Resultados -->
    <div id="contenedor-pots"></div>

    <!-- Paginación -->
    <div id="paginacion" class="d-flex justify-content-between align-items-center mt-3" style="display:none">
      <small class="text-muted" id="info-pagina"></small>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary" id="btn-anterior">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button class="btn btn-outline-secondary" id="btn-siguiente">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </main>

  <div id="oot-footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../oot.js"></script>
  <script>
    'use strict';
    const API = window.OOT_API_BASE || '';
    let offset = 0;
    const POR_PAGINA = 15;
    let total = 0;
    let todosDeptos = [];
    let todosMunis  = [];

    window.addEventListener('DOMContentLoaded', async () => {
      await cargarFiltros();
      await buscar(0);
    });

    async function cargarFiltros() {
      try {
        const [config, filtros] = await Promise.all([
          fetch(API + '/api/igac/config').then(r => r.json()),
          fetch(API + '/api/igac/documentos/filtros').then(r => r.json())
        ]);

        const unidades = config.UNIDAD || [];
        todosDeptos = unidades.filter(u => u.type === 'DEPTO');
        todosMunis  = unidades.filter(u => u.type === 'MUNI');

        const selD = document.getElementById('filtro-depto');
        todosDeptos.forEach(d => {
          const o = document.createElement('option');
          o.value = d.id; o.textContent = d.text;
          selD.appendChild(o);
        });

        const annios = filtros?.annio?.FECHA || [];
        const selA = document.getElementById('filtro-annio');
        annios.forEach(a => {
          const o = document.createElement('option');
          o.value = a.id || a; o.textContent = a.text || a;
          selA.appendChild(o);
        });
      } catch(e) {
        console.warn('Error cargando filtros:', e);
        // H-18: mensaje funcional al usuario cuando el servicio del IGAC no responde
        // (antes fallaba en silencio; los filtros de depto/año quedaban vacíos sin explicación).
        if (window.OOT && OOT.notify) OOT.notify('No se pudieron cargar los filtros del servicio IGAC. Puede intentar de nuevo o usar la búsqueda.', 'warn');
      }
    }

    document.getElementById('filtro-depto').addEventListener('change', function() {
      const depto = this.value;
      const selM  = document.getElementById('filtro-municipio');
      selM.innerHTML = '<option value="">Todos</option>';
      const munis = depto ? todosMunis.filter(m => m.id.startsWith(depto)) : todosMunis;
      munis.forEach(m => {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.text;
        selM.appendChild(o);
      });
      buscar(0);
    });

    async function buscar(off = 0) {
      document.getElementById('estado-carga').style.display = 'block';
      document.getElementById('contenedor-pots').innerHTML = '';
      document.getElementById('paginacion').style.display = 'none';

      const depto = document.getElementById('filtro-depto').value;
      const muni  = document.getElementById('filtro-municipio').value;
      const ann   = document.getElementById('filtro-annio').value;
      const texto = document.getElementById('input-busqueda').value.trim();

      const params = new URLSearchParams({ start: off, length: POR_PAGINA, search: texto });
      if (muni)  params.append('unidad', muni);
      else if (depto) params.append('unidad', depto);
      if (ann)   params.append('annio', ann);

      try {
        const data = await fetch(`${API}/api/igac/documentos?${params}`).then(r => r.json());
        total  = data.recordsFiltered || data.recordsTotal || 0;
        offset = off;
        renderPOTs(data.data || []);
      } catch(e) {
        document.getElementById('contenedor-pots').innerHTML = `
          <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            No se pudo conectar con el servicio del IGAC.
            <a href="https://www.colombiaot.gov.co/pot/" target="_blank" class="alert-link ml-2">
              Consultar en Colombia OT <i class="fas fa-external-link-alt"></i>
            </a>
          </div>`;
      } finally {
        document.getElementById('estado-carga').style.display = 'none';
      }
    }

    function renderPOTs(items) {
      const cont = document.getElementById('contenedor-pots');
      if (!items.length) {
        cont.innerHTML = '<p class="text-center text-muted py-4">No se encontraron POTs con los filtros seleccionados.</p>';
        return;
      }
      const esc = s => window.OOT?.escapeHtml ? window.OOT.escapeHtml(s) : String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#039;');

      const tabla = document.createElement('div');
      tabla.className = 'table-responsive';
      tabla.innerHTML = `
        <table class="table table-hover">
          <thead class="thead-dark">
            <tr>
              <th>Municipio / Nombre</th>
              <th>Tipo</th>
              <th>Fecha</th>
              <th>Entidad</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody-pots"></tbody>
        </table>`;
      cont.appendChild(tabla);

      const tbody = document.getElementById('tbody-pots');
      items.forEach(item => {
        const nombre = item.NOMBRE      || item.nombre      || item.UNIDAD || '—';
        const tipo   = item.TIPO_RECURSO|| item.tipo        || item.TIPO_DOCUMENTO || '—';
        const fecha  = (item.FECHA_PUBLICACION || '').toString().match(/\d{4}/)?.[0] || '—';
        const ent    = item.ENTIDAD     || item.RESPONSABLE || item.UNIDAD || '—';
        const url    = item.URL1        || item.URL_METADATO|| item.URL || item.url || '';
        const tr     = document.createElement('tr');
        tr.innerHTML = `
          <td>${esc(nombre)}</td>
          <td><span class="badge badge-info">${esc(tipo)}</span></td>
          <td>${esc(fecha)}</td>
          <td class="small text-muted">${esc(ent)}</td>
          <td>${url ? `<a href="${esc(url)}" target="_blank" class="btn btn-sm btn-outline-primary">
            <i class="fas fa-external-link-alt"></i></a>` : ''}</td>`;
        tbody.appendChild(tr);
      });

      const totalPags = Math.ceil(total / POR_PAGINA);
      const paginaNum = Math.floor(offset / POR_PAGINA);
      document.getElementById('info-pagina').textContent =
        `${offset + 1}–${Math.min(offset + POR_PAGINA, total)} de ${total} POTs`;
      document.getElementById('btn-anterior').disabled = paginaNum === 0;
      document.getElementById('btn-siguiente').disabled = paginaNum >= totalPags - 1;
      document.getElementById('paginacion').style.display = 'flex';
    }

    document.getElementById('btn-buscar').addEventListener('click', () => buscar(0));
    document.getElementById('input-busqueda').addEventListener('keydown', e => { if(e.key==='Enter') buscar(0); });
    document.getElementById('filtro-annio').addEventListener('change', () => buscar(0));
    document.getElementById('filtro-municipio').addEventListener('change', () => buscar(0));

    window.OOT.loadShell();
  </script>
</body>
</html>
