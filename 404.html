<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Redireccionando...</title>
  <script>
    // Obtener la ruta de la URL actual
    var path = window.location.pathname;
    
    var newPath = path;
    // 1. Normalizar carpeta antigua colombiaot -> colombia-ot
    if (path.includes('/colombiaot/')) {
      newPath = path.replace('/colombiaot/', '/colombia-ot/');
    }
    
    // 2. Normalizar extensión errónea ruta.html -> ruta/index.html
    if (newPath.includes('/ruta.html')) {
      newPath = newPath.replace('/ruta.html', '/ruta/index.html');
    }
    
    // 3. Redirigir si la ruta cambió, o ir a index.html si es un 404 real
    if (newPath !== path) {
      window.location.replace(newPath);
    } else {
      window.location.replace('/index.html');
    }
  </script>
</head>
<body>
  <div style="font-family: sans-serif; text-align: center; margin-top: 10%;">
    <h2>Redireccionando al Observatorio de Ordenamiento Territorial...</h2>
    <p>Si no es redirigido automáticamente, haga clic en el siguiente enlace:</p>
    <a href="/colombia-ot/ruta/index.html" style="color: #0d6efd; text-decoration: none; font-weight: bold;">Acceder a la Ruta del POT</a>
  </div>
</body>
</html>
