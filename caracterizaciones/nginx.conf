server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:bak|head|old|orig|tmp|log|env|ini|conf|sql)$ {
        return 404;
    }

    location = / {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        limit_except GET HEAD {
            deny all;
        }
    }
}
